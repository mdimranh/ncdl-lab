<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04101a"/>
      <stop offset="100%" stop-color="#062530"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3a34"/>
      <stop offset="100%" stop-color="#072a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2cc7c4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2cc7c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5cd9d6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="450" rx="680" ry="400" fill="url(#glow)"/>

  <g transform="rotate(-6 800 450)">
    <rect x="220" y="220" width="1160" height="470" rx="26" fill="url(#board)" stroke="#2cc7c4" stroke-opacity="0.35" stroke-width="2"/>
    <!-- traces -->
    <g stroke="#5cd9d6" stroke-opacity="0.30" fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M280 300h300l60 60h240"/>
      <path d="M280 380h180l40 40h420"/>
      <path d="M280 470h380l50-50h150"/>
      <path d="M280 560h240l70 70h330"/>
      <path d="M1320 300h-260l-50 50"/>
      <path d="M1320 600h-300l-60-60h-120"/>
      <path d="M880 640v-50l40-40h260"/>
      <path d="M640 640v-90"/>
    </g>
    <!-- vias -->
    <g fill="#0b3f3c" stroke="#5cd9d6" stroke-opacity="0.55" stroke-width="2">
      <circle cx="880" cy="360" r="9"/><circle cx="760" cy="460" r="9"/><circle cx="1120" cy="460" r="9"/>
      <circle cx="1010" cy="360" r="9"/><circle cx="920" cy="630" r="9"/><circle cx="640" cy="550" r="9"/>
    </g>
    <!-- power stage -->
    <rect x="900" y="290" width="330" height="270" rx="12" fill="#0b2230" stroke="#5cd9d6" stroke-opacity="0.4"/>
    <g fill="#2cc7c4" fill-opacity="0.55">
      <rect x="930" y="320" width="120" height="70" rx="6"/>
      <rect x="1070" y="320" width="130" height="70" rx="6"/>
      <rect x="930" y="410" width="270" height="18" rx="9"/>
      <rect x="930" y="444" width="200" height="10" rx="5"/>
      <rect x="930" y="464" width="234" height="10" rx="5"/>
      <rect x="930" y="484" width="160" height="10" rx="5"/>
    </g>
    <!-- connectors -->
    <g fill="#0b2230" stroke="#5cd9d6" stroke-opacity="0.45">
      <rect x="250" y="620" width="260" height="40" rx="6"/>
      <rect x="1080" y="620" width="180" height="40" rx="6"/>
    </g>
    <g fill="#5cd9d6" fill-opacity="0.5">
      <rect x="264" y="634" width="228" height="12" rx="3"/>
      <rect x="1094" y="634" width="152" height="12" rx="3"/>
    </g>
    <!-- mcu -->
    <rect x="520" y="300" width="180" height="180" rx="10" fill="#0c2a34" stroke="#5cd9d6" stroke-opacity="0.55"/>
    <g fill="#99eae6" fill-opacity="0.35">
      <rect x="544" y="324" width="132" height="10" rx="5"/>
      <rect x="544" y="346" width="96" height="8" rx="4"/>
      <rect x="544" y="366" width="120" height="8" rx="4"/>
      <rect x="544" y="386" width="70" height="8" rx="4"/>
    </g>
    <text x="544" y="450" font-family="monospace" font-size="13" fill="#5cd9d6" fill-opacity="0.7">M7 · FOC 20 kHz</text>
  </g>

  <g font-family="monospace" font-size="16" fill="#99eae6" fill-opacity="0.55" letter-spacing="5">
    <text x="90" y="120">GAN MOTOR DRIVE BOARD · REV C</text>
    <text x="1100" y="820">4-LAYER · 42% MASS REDUCTION</text>
  </g>
</svg>
